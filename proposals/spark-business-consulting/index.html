<style>
:root{--cream:#F5F1EB;--ink:#2A2A2A;--warm:#6B615A;--red:#CB3B3B;--red-dark:#A82F2F;--card:#FDFBF8;--line:#E3DCD2}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--cream);color:var(--warm);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lock{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:48px 40px;max-width:420px;width:100%;text-align:center}
.wordmark{font-family:'Playfair Display',serif;font-weight:700;font-size:24px;color:var(--ink)}

p{font-size:14px;line-height:1.55;margin-bottom:22px}
input{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:100px;font-family:'Inter',sans-serif;font-size:15px;text-align:center;background:var(--cream);color:var(--ink);outline:none}
input:focus{border-color:var(--red)}
button{width:100%;margin-top:12px;background:var(--red);color:#fff;border:none;font-weight:600;font-family:'Inter',sans-serif;font-size:15px;padding:13px 26px;border-radius:100px;cursor:pointer;transition:background .15s}
button:hover{background:var(--red-dark)}
.err{color:var(--red-dark);font-size:13px;margin-top:12px;min-height:18px}
.foot{margin-top:24px;font-size:12px;color:var(--warm)}
